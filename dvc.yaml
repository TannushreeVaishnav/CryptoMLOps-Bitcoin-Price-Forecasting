stages:
  Preprocessing:
    cmd: python -m src.pipelines.preprocess_flow
    desc: "Architecture Layer: Parses raw BTC data, engineers technical indicators, and performs data splitting/scaling."
    deps:
      - data/raw/bitcoin_investing.csv
      - src/data/
      - params.yaml
    outs:
      - data/processed/
      - artifacts/scaler.pkl

  Model_Training_and_Ensemble:
    cmd: python -m src.pipelines.train_flow
    desc: "Architecture Layer: Trains the LSTM and XGBoost models, calculates the Weighted Ensemble, and evaluates against baselines."
    deps:
      - data/processed/
      - artifacts/scaler.pkl
      - src/models/
      - src/pipelines/train_flow.py
      - params.yaml
    outs:
      - artifacts/xgb_model.pkl
      - artifacts/lstm_model.pth
    metrics:
      - metrics/scores.json:
          cache: false