stages:
  Preprocessing_Pipeline:
    cmd: python -m src.pipelines.preprocess_flow
    desc: "Data Layer & Preprocessing: Fetches, engineers 35+ features, and scales BTC data."
    deps:
      - data/raw/bitcoin_investing.csv
      - src/data/
      - params.yaml
    outs:
      - data/processed/
      - artifacts/scaler.pkl

  Model_Ensemble_and_Evaluation:
    cmd: python -m src.pipelines.train_flow
    desc: "LSTM & XGBoost Models -> Weighted Ensemble: Trains models and evaluates performance against baselines."
    deps:
      - data/processed/
      - artifacts/scaler.pkl
      - src/models/
      - src/pipelines/train_flow.py
      - params.yaml
    outs:
      - artifacts/xgb_model.pkl
      - artifacts/lstm_model.pth
    metrics:
      - metrics/scores.json:
          cache: false