<!-- SHARED MODAL UTILITY — injected by app.py into every tab -->
<div id="btc-modal-overlay" onclick="closeBtcModal()" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:9998; backdrop-filter:blur(4px);"></div>
<div id="btc-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:9999; width:min(560px, 90vw); background:#0e0e0e; border:1px solid #424754; border-radius:12px; padding:32px; font-family:'Inter',sans-serif; color:#e5e2e1; box-shadow:0 25px 60px rgba(0,0,0,0.7);">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <span id="btc-modal-title" style="font-family:'Hanken Grotesk',sans-serif; font-weight:700; font-size:20px; color:#e5e2e1;">Info</span>
    <button onclick="closeBtcModal()" style="background:none; border:none; color:#8c909f; cursor:pointer; font-size:22px; line-height:1;">✕</button>
  </div>
  <div id="btc-modal-body" style="font-size:14px; line-height:1.7; color:#c2c6d6;"></div>
  <div id="btc-modal-footer" style="margin-top:24px; display:flex; gap:12px; flex-wrap:wrap;"></div>
</div>
<script>
function openBtcModal(title, bodyHtml, footerHtml) {
  document.getElementById('btc-modal-title').innerHTML = title;
  document.getElementById('btc-modal-body').innerHTML = bodyHtml;
  document.getElementById('btc-modal-footer').innerHTML = footerHtml || '';
  document.getElementById('btc-modal-overlay').style.display = 'block';
  document.getElementById('btc-modal').style.display = 'block';
}
function closeBtcModal() {
  document.getElementById('btc-modal-overlay').style.display = 'none';
  document.getElementById('btc-modal').style.display = 'none';
}
function openLink(url) { window.open(url, '_blank'); }
</script>
